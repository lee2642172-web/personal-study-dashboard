<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <script>
      // Apply before the app/styles load so a saved dark theme never flashes white.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("personal-study-dashboard:theme");
        } catch {}
        const dark =
          saved === "dark" ||
          (saved !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#101826" : "#f6f7f9");
      })();
    </script>
    <title>MY DASHBOARD · 나의 배움 지도</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
